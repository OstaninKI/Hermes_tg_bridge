[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-tg-bridge"
version = "0.1.0"
description = "Telethon HTTP bridge for Hermes Agent (live Telegram user account)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "telethon>=1.45.0,<1.46",
    "fastapi>=0.133.0,<1",
    # not imported directly: floor pinned because every Starlette below 1.3.1 has known CVEs
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30.0,<1",
    "pydantic>=2.7,<3",
    "qrcode[pil]>=7.4",
]

[project.scripts]
hermes-tg-bridge = "hermes_tg_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hermes_tg_bridge*"]

[project.optional-dependencies]
dev = ["pytest>=9.0.3", "httpx>=0.27,<1"]
# TELEGRAM_PROXY_TYPE=socks5 needs it; Telethon cannot open a SOCKS connection without it
proxy = ["python-socks[asyncio]>=2.4,<4"]
# native AES for Telethon: much faster media transfers (0.5.2 is the first with wheels for Python 3.14)
fast = ["cryptg>=0.5.2,<1"]
